{{ define "main" }}
  <section>
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </section>
  {{ range .Pages }}
    <section id="{{ replace .LinkTitle " " "-" | strings.ToLower }}">
      <div class="row justify-content-md-center">
        <div class="col-md-8">
          <h2>{{ .Title }}</h2>
          {{ .Content }}
        </div>
      </div>
    </section>
  {{ end }}
{{ end }}
