{{ define "main" }}
  <section id="{{ .Param "id" }}">
    <div class="row justify-content-md-center">
      <div class="col-md-8">
        <h1>{{ .Title }}</h1>
        {{ .Content }}
      </div>
    </div>
  </section>
  {{ range .Pages }}
    <section id="{{ .Param "id" }}">
      <div class="row justify-content-md-center">
        <div class="col-md-8">
          <h2>{{ .Title }}</h2>
          {{ .Content }}
        </div>
      </div>
    </section>
  {{ end }}
{{ end }}
